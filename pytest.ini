[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出详细信息
addopts = -v --tb=short

# 指定超时时间 (需要安装pytest-timeout插件)
# timeout = 300

# 标记可用的测试类型
markers =
    integration: marks tests as integration tests
    concurrency: marks tests as concurrency tests
    flood: marks tests as connection flood tests